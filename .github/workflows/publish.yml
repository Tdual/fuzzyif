name: publish

# Publishes to PyPI via Trusted Publishing (OIDC): no API token stored in the repo.
# One-time setup on https://pypi.org/manage/account/publishing/ :
#   project name: fuzzyif, owner: Tdual, repository: fuzzyif,
#   workflow: publish.yml, environment: pypi
# Then push a tag like v0.2.0.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
